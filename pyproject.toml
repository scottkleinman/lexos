[project]
name = "lexos"
version = "0.1.0b31"
description = "A Python library that reproduces and extends text analysis tools from the Lexos web app. Designed for entry-level students and researchers in the Humanities, with language-agnostic support for historical and under-resourced languages."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Scott Kleinman", email = "scott.kleinman@csun.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.85",
    "beautifulsoup4>=4.13.0",
    "chardet>=5.2.0",
    "cytoolz>=1.0.1",
    "kaleido>=1.0.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.6",
    "javaobj-py3>=0.4.4",
    "matplotlib>=3.10.0",
    "msgpack>=1.1.0",
    "natsort>=8.4.0",
    "nbformat>=5.10.4",
    "pandas>=2.2.3",
    "plotly>=6.2.0,<7.0.0",
    "puremagic>=2.0.0b2",
    "pydantic>=2.10.4",
    "pydantic-extra-types>=2.10.2",
    "pypdf>=6.14.2",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.2",
    "rich>=13.9.4",
    "ruff>=0.11.12",
    "seaborn>=0.13.2",
    "smart-open>=7.1.0",
    "sniffio>=1.3.1",
    "spacy>=3.8.14",
    "en-core-web-sm>=3.8.0",
    "xx-sent-ud-sm>=3.8.0",
    "srsly>=2.5.0",
    "textacy>=0.13.0",
    "wordcloud>=1.9.4",
    "fastcluster>=1.3.0",
    "sqlalchemy>=2.0.44",
    "scipy>=1.15.1",
    "html-to-markdown>=2.8.3",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0.0",
    "nvidia-cublas-cu12",
    "nvidia-curand-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-cufft-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cuda-runtime-cu12",
]
transformers = [
    "spacy-transformers>=1.3.5,<1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pip>=24.3.1",
    "pytest-mock>=3.14.0",
    "pytest>=9.0.3",
    "pluggy>=1.4.0,<2.0.0",
    "setuptools>=75.6.0",
    "tk>=0.1.0",
    "wheel>=0.45.1",
    "pytest-cov>=6.1.1",
    "ruff>=0.16.0",
    "tk>=0.1.0",
    "tabulate>=0.9.0",
    "ipykernel>=6.29.5",
    "pre-commit>=4.5.0",
    "nbconvert>=7.17.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib", ]
filterwarnings = [
    # seaborn 0.13.x internally passes vert= to matplotlib's boxplot, which
    # matplotlib 3.10+ deprecated. This is a seaborn bug, not a Lexos issue.
    "ignore::PendingDeprecationWarning:seaborn",
]

[tool.uv.sources]
xx-sent-ud-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_sent_ud_sm-3.8.0/xx_sent_ud_sm-3.8.0-py3-none-any.whl" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv]
override-dependencies = [
    "urllib3>=2.7.0",  # Address vulnerabilities in third-party libraries
    "pillow>=12.3.0",
    "soupsieve>=2.8.4",
    "GitPython>=3.1.55",
    "setuptools>=83.0.0",
    "orjson>=3.11.6",
    "lxml>=6.1.0",
    "tornado>=6.5.7",
    "fonttools>=4.60.2"
]

[tool.ruff.lint]
# Enable all `pydocstyle` rules, limiting to those that adhere to the
# Google convention via `convention = "google"`, below.
select = ["D"]

# Disable `D417`, which requires documentation for every function parameter.
# Just in case -- we can always add it later.
ignore = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Do not require documentation for docstring args in the `tests/` directory.
"!tests/**.py" = ["D417"]
