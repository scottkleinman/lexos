name: Release (TestPyPI)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and upload to TestPyPI (branch, tag, or SHA). Defaults to the triggering ref."
        required: false
        type: string

concurrency:
  group: release-testpypi-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution for ref ${{ inputs.ref || github.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Clean stale build artifacts
        run: |
          rm -rf dist build *.egg-info

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: |
          uv run --isolated --no-project \
            --with dist/*.whl \
            --with https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl \
            --with https://github.com/explosion/spacy-models/releases/download/xx_sent_ud_sm-3.8.0/xx_sent_ud_sm-3.8.0-py3-none-any.whl \
            python -c "import lexos; print(lexos.__version__)"

      - name: Smoke test (source distribution)
        run: |
          uv run --isolated --no-project \
            --with dist/*.tar.gz \
            --with https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl \
            --with https://github.com/explosion/spacy-models/releases/download/xx_sent_ud_sm-3.8.0/xx_sent_ud_sm-3.8.0-py3-none-any.whl \
            python -c "import lexos; print(lexos.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-testpypi
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: test-pypi
      url: https://test.pypi.org/project/lexos/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-testpypi
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
